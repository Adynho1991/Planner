<!DOCTYPE html>
<html lang="ro">
<link rel="manifest" href="./manifest.json"><head>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "59d24dd9-3384-45d6-b50b-808743e44f4b",
    });
  });
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Planner V5</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f6f8;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{
  max-width:760px;
  margin:auto;
  padding:22px 16px 45px;
}
header{
  margin-bottom:22px;
}
h1{
  margin:0;
  font-size:36px;
  letter-spacing:-1px;
}
.sub{
  color:#6b7280;
  margin-top:4px;
  font-size:18px;
}
.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  background:#f7f8fa;
  border-radius:18px;
  padding:16px 8px;
  text-align:center;
}
.num{
  font-size:30px;
  font-weight:800;
}
.label{
  color:#6b7280;
  font-size:13px;
  margin-top:3px;
}
.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:18px;
}
.bar{
  height:100%;
  width:0%;
  background:#111827;
  transition:.25s;
}
h2{
  margin:0 0 15px;
  font-size:25px;
}
form{
  display:grid;
  gap:10px;
}
input,select,button{
  width:100%;
  min-height:52px;
  border:1px solid #d1d5db;
  border-radius:15px;
  padding:0 15px;
  font:inherit;
  background:white;
}
input:focus,select:focus{
  outline:2px solid #111827;
}
button{
  border:0;
  background:#111827;
  color:white;
  font-weight:700;
}
.add{
  font-size:17px;
}
.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
}
.filter{
  width:auto;
  min-height:42px;
  padding:0 15px;
  white-space:nowrap;
  background:#f1f2f4;
  color:#374151;
}
.filter.active{
  background:#111827;
  color:white;
}
.task{
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
  background:white;
}
.task.done{
  opacity:.6;
}
.task.done .title{
  text-decoration:line-through;
}
.tasktop{
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.check{
  width:25px;
  min-width:25px;
  height:25px;
  min-height:25px;
  padding:0;
  border-radius:50%;
  border:2px solid #9ca3af;
  background:white;
  margin-top:2px;
}
.done .check{
  background:#111827;
  border-color:#111827;
}
.title{
  font-size:17px;
  font-weight:700;
  flex:1;
  line-height:1.35;
}
.delete{
  width:auto;
  min-height:34px;
  padding:0 10px;
  background:#f3f4f6;
  color:#6b7280;
  font-size:13px;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:10px 0 0 37px;
}
.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:9px;
  background:#f1f5f9;
  color:#475569;
  font-size:12px;
}
.empty{
  text-align:center;
  color:#6b7280;
  padding:25px 10px;
}
@media(max-width:500px){
  .app{padding:18px 14px 40px}
  h1{font-size:34px}
  .card{padding:18px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>Planner</h1>
  <div class="sub">Obiectivele mele</div>
</header>

<div class="card">
  <div class="stats">
    <div class="stat">
      <div class="num" id="total">0</div>
      <div class="label">TOTAL</div>
    </div>
    <div class="stat">
      <div class="num" id="done">0</div>
      <div class="label">FINALIZATE</div>
    </div>
    <div class="stat">
      <div class="num" id="percent">0%</div>
      <div class="label">PROGRES</div>
    </div>
  </div>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<div class="card">
  <h2>Adaugă obiectiv</h2>

  <form id="form">

    <input
      id="title"
      type="text"
      placeholder="Ex.: Sun clientul pentru ofertă"
      required
    >

    <div class="fields">
      <input id="date" type="date" required>
      <input id="time" type="time">
    </div>

    <div class="fields">
      <select id="category">
        <option value="Personal">Personal</option>
        <option value="Muncă">Muncă</option>
        <option value="Familie">Familie</option>
        <option value="Important">Important</option>
      </select>

      <select id="priority">
        <option value="Normal">Prioritate normală</option>
        <option value="Urgent">🔴 Urgent</option>
        <option value="Important">🟠 Important</option>
        <option value="Scăzut">🟢 Scăzut</option>
      </select>
    </div>

    <button class="add" type="submit">
      + Adaugă obiectiv
    </button>

  </form>
</div>

<div class="card">
  <h2>Obiective</h2>

  <div class="filters">
    <button class="filter active" data-filter="all">Toate</button>
    <button class="filter" data-filter="today">Azi</button>
    <button class="filter" data-filter="open">Deschise</button>
    <button class="filter" data-filter="done">Finalizate</button>
  </div>

  <div id="list" style="margin-top:15px"></div>
</div>

</div>

<script>
const KEY="planner_v5";

let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentFilter="all";

const $=id=>document.getElementById(id);

function save(){
  localStorage.setItem(KEY,JSON.stringify(tasks));
  render();
}

function today(){
  return new Date().toISOString().slice(0,10);
}

$("date").value=today();

function toggle(id){
  const task=tasks.find(t=>t.id===id);
  if(task){
    task.done=!task.done;
    save();
  }
}

function removeTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  save();
}

function render(){

  const total=tasks.length;
  const done=tasks.filter(t=>t.done).length;
  const percent=total ? Math.round(done/total*100) : 0;

  $("total").textContent=total;
  $("done").textContent=done;
  $("percent").textContent=percent+"%";
  $("bar").style.width=percent+"%";

  let visible=[...tasks];

  if(currentFilter==="today"){
    visible=visible.filter(t=>t.date===today());
  }

  if(currentFilter==="open"){
    visible=visible.filter(t=>!t.done);
  }

  if(currentFilter==="done"){
    visible=visible.filter(t=>t.done);
  }

  visible.sort((a,b)=>{

    if(a.done!==b.done)
      return a.done-b.done;

    const da=(a.date||"")+" "+(a.time||"23:59");
    const db=(b.date||"")+" "+(b.time||"23:59");

    return da.localeCompare(db);
  });

  if(!visible.length){
    $("list").innerHTML=
      '<div class="empty">Nu ai obiective aici 👍</div>';
    return;
  }

  $("list").innerHTML=visible.map(t=>{

    const date=t.date
      ? new Date(t.date+"T00:00:00")
        .toLocaleDateString("ro-RO",{
          day:"2-digit",
          month:"short"
        })
      : "";

    return `
      <div class="task ${t.done?"done":""}">

        <div class="tasktop">

          <button
            class="check"
            onclick="toggle(${t.id})"
            aria-label="Finalizează">
            ${t.done?"✓":""}
          </button>

          <div class="title">${escapeHTML(t.title)}</div>

          <button
            class="delete"
            onclick="removeTask(${t.id})">
            Șterge
          </button>

        </div>

        <div class="meta">

          ${date
            ? `<span class="pill">📅 ${date}</span>`
            : ""}

          ${t.time
            ? `<span class="pill">⏰ ${t.time}</span>`
            : ""}

          <span class="pill">${escapeHTML(t.category)}</span>

          <span class="pill">${escapeHTML(t.priority)}</span>

        </div>

      </div>
    `;
  }).join("");
}

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

$("form").addEventListener("submit",e=>{

  e.preventDefault();

  tasks.push({
    id:Date.now(),
    title:$("title").value.trim(),
    date:$("date").value,
    time:$("time").value,
    category:$("category").value,
    priority:$("priority").value,
    done:false
  });

  e.target.reset();
  $("date").value=today();

  save();

  $("title").focus();
});

document.querySelectorAll(".filter").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".filter")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    currentFilter=btn.dataset.filter;

    render();
  });

});

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service Worker activ"))
      .catch(err => console.error("Service Worker:", err));
  });
}
</script>

<script>
async function verificaRemindere() {
  const acum = new Date();
  const dataAzi = acum.toISOString().slice(0, 10);
  const oraAzi = acum.toTimeString().slice(0, 5);

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);

    try {
      const date = JSON.parse(localStorage.getItem(key));

      if (!Array.isArray(date)) continue;

      date.forEach(async task => {
        if (!task || task.done) return;

        const dataTask = task.date || "";
        const oraTask = task.start || task.time || "";

        if (dataTask !== dataAzi || oraTask !== oraAzi) return;

        const reminderKey = "reminder_" + (task.id || task.title) + "_" + dataAzi + "_" + oraAzi;

        if (sessionStorage.getItem(reminderKey)) return;

        const registration = await navigator.serviceWorker.ready;

        await registration.showNotification("🔔 Planner", {
          body: task.title || "Ai un obiectiv programat acum!",
          icon: "./icon-192.png",
          badge: "./icon-192.png"
        });

        sessionStorage.setItem(reminderKey, "1");
      });
    } catch (e) {}
  }
}

setInterval(verificaRemindere, 10000);
verificaRemindere();
const notificationButton = document.createElement("button");
notificationButton.textContent = "🔔 Activează notificările";
notificationButton.style.cssText =
  "width:100%;padding:14px;margin:15px 0;border:0;border-radius:12px;background:#111827;color:white;font-size:17px;font-weight:600;";

document.querySelector(".app").appendChild(notificationButton);

notificationButton.addEventListener("click", async () => {
  if (!("Notification" in window)) {
    alert("Notificările nu sunt disponibile în acest browser.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission !== "granted") {
    alert("Notificările nu sunt activate.");
    return;
  }

  const registration = await navigator.serviceWorker.ready;

  await registration.showNotification("Planner 🔔", {
    body: "Notificările sunt activate cu succes!",
    icon: "./icon-192.png",
    badge: "./icon-192.png"
  });

  notificationButton.textContent = "✅ Notificările sunt active";
});
</script>

</body>
</html>
