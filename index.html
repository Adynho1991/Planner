<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Planner V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
.app{max-width:760px;margin:auto;padding:18px 14px 40px}h1{margin:0;font-size:32px}.sub{color:#6b7280;margin-top:4px}
.card{background:#fff;border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 3px 14px #0000000b}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border-radius:14px;padding:13px;text-align:center;background:#f8fafc}.num{font-size:25px;font-weight:800}.label{font-size:12px;color:#6b7280}
.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#22c55e;transition:.25s}
form{display:grid;gap:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,select,button{width:100%;font:inherit;border-radius:12px;padding:12px;border:1px solid #d1d5db;background:#fff}button{border:0;background:#111827;color:white;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filter.active{outline:3px solid #d1d5db}
.task{padding:13px;margin:9px 0;border-radius:15px;border-left:5px solid #ef4444;background:#fff1f2}.task.done{border-left-color:#22c55e;background:#ecfdf5}
.row{display:flex;align-items:center;gap:10px}.check{width:23px;height:23px}.main{flex:1}.title{font-weight:750}.done .title{text-decoration:line-through;color:#15803d}
.meta{font-size:12px;color:#6b7280;margin-top:5px;line-height:1.5}.late{color:#dc2626;font-weight:700}.ok{color:#15803d;font-weight:700}
.delete{width:auto;padding:7px 9px;background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#6b7280;padding:24px}
.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e5e7eb;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<header><h1>Planner</h1><div class="sub">Dashboard V3 · obiectivele mele</div></header>

<div class="card">
 <div class="stats">
  <div class="stat"><div class="num" id="total">0</div><div class="label">TOTAL</div></div>
  <div class="stat"><div class="num" id="done">0</div><div class="label">FINALIZATE</div></div>
  <div class="stat"><div class="num" id="left">0</div><div class="label">RĂMASE</div></div>
  <div class="stat"><div class="num" id="late">0</div><div class="label">ÎNTÂRZIATE</div></div>
 </div>
 <div style="margin-top:14px"><b id="percent">0%</b> realizat</div>
 <div class="progress"><div id="bar" class="bar"></div></div>
</div>

<div class="card">
<h2>Adaugă obiectiv</h2>
<form id="form">
<input id="title" placeholder="Ex.: Sun clientul pentru ofertă" required>
<div class="grid">
<div><label>Început</label><input id="start" type="date"></div>
<div><label>Termen final</label><input id="end" type="date"></div>
</div>
<button>+ Adaugă obiectiv</button>
</form>
</div>

<div class="card">
<h2>Obiective</h2>
<div class="filters">
<button id="allBtn" class="filter active" onclick="setFilter('all')">Toate</button>
<button id="openBtn" class="filter" onclick="setFilter('open')">Rămase</button>
<button id="doneBtn" class="filter" onclick="setFilter('done')">Finalizate</button>
<button id="lateBtn" class="filter" onclick="setFilter('late')">Întârziate</button>
</div>
<div id="list"></div>
</div>
</div>

<script>
const KEY="planner_v3_tasks";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]"), filter="all";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function fmt(d){return d?new Date(d+"T00:00:00").toLocaleDateString("ro-RO"):"—"}
function isLate(t){return !t.done&&t.end&&new Date(t.end+"T23:59:59")<new Date()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setFilter(f){filter=f;render()}
function render(){
 const total=tasks.length,done=tasks.filter(t=>t.done).length,late=tasks.filter(isLate).length,left=total-done,pct=total?Math.round(done/total*100):0;
 $("total").textContent=total;$("done").textContent=done;$("left").textContent=left;$("late").textContent=late;$("percent").textContent=pct+"%";$("bar").style.width=pct+"%";
 ["all","open","done","late"].forEach(x=>$(x+"Btn").classList.toggle("active",filter===x));
 let visible=tasks.filter(t=>filter==="all"?true:filter==="open"? !t.done:filter==="done"?t.done:isLate(t));
 const list=$("list");
 if(!visible.length){list.innerHTML='<div class="empty">Nu există obiective în această categorie.</div>';return}
 list.innerHTML=visible.map(t=>{
  const i=tasks.indexOf(t),late=isLate(t);
  return `<div class="task ${t.done?"done":""}">
   <div class="row">
    <input class="check" type="checkbox" ${t.done?"checked":""} onchange="toggle(${i})">
    <div class="main">
     <div class="title">${esc(t.title)}</div>
     <div class="meta">Perioada: ${fmt(t.start)} → ${fmt(t.end)}<br>Status: <span class="pill">${t.done?"DA":"NU"}</span>
     ${late?'<br><span class="late">⚠ TERMEN DEPĂȘIT</span>':t.done?'<br><span class="ok">✓ FINALIZAT</span>':''}</div>
    </div>
    <button class="delete" onclick="removeTask(${i})">Șterge</button>
   </div>
  </div>`;
 }).join("");
}
$("form").addEventListener("submit",e=>{
 e.preventDefault();let title=$("title").value.trim(),start=$("start").value,end=$("end").value;
 if(end&&start&&end<start){alert("Termenul final nu poate fi înaintea începutului.");return}
 tasks.push({title,start,end,done:false});$("title").value="";$("start").value="";$("end").value="";save();
});
function toggle(i){tasks[i].done=!tasks[i].done;save()}
function removeTask(i){tasks.splice(i,1);save()}
render();
</script>
</body>
</html>
